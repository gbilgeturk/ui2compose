# pipeline_config.yaml
# =====================
# Pipeline configuration file
# You can change the pipeline settings by editing this file

# INPUT SETTINGS
input:
  image: "examples/com.shazam.android-screens_screenshot_3.png"
  model: "runs/oversample_5k/weights/best.pt"
  dataset_yaml: "configs/dataset.yaml"

# OUTPUT SETTINGS
output:
  directory: "output"

# DETECTION SETTINGS
detection:
  confidence_threshold: 0.3  # Pipeline/demo inference threshold
  iou_threshold: 0.5         # NMS IoU threshold
  imgsz: 640                 # Input resolution (same as training)

# FEATURE FLAGS
features:
  visualization: true      # Produce visual output

# NOTES:
# - model: oversample_5k is the model that gives the best result (test mAP@50=48.70%, validation mAP@50=51.82%)
# - confidence_threshold: 0.3 is used for the pipeline (practical use, fewer false positives)
#   Evaluation scripts use 0.15 (standard for computing the precision-recall curve)
# - imgsz: 640 was used in training, it must be the same at inference
# - visualization: setting it to false runs faster (no visuals are produced)
