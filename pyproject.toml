[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ui2compose"
version = "1.2.0"
description = "Automatic generation of Jetpack Compose UI code from Android screen designs using YOLO-based component detection"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Göktürk Bilgetürk", email = "gbilgeturk@yahoo.com" },
    { name = "Murat Saran", email = "saran@cankaya.edu.tr" },
]
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Layout evaluation (ui2compose-eval-layout): tree edit distance (APTED, with a
# Zhang-Shasha cross-check) and Hungarian box matching.
eval = ["apted>=1.0.3", "zss>=1.2.0", "scipy>=1.10"]

[project.urls]
Repository = "https://github.com/gbilgeturk/ui2compose"

[project.scripts]
ui2compose = "ui2compose.infer.pipeline:main"
ui2compose-codegen = "ui2compose.infer.generate_compose_code:main"
ui2compose-demo = "ui2compose.webapp:launch"
ui2compose-parse-redraw = "ui2compose.preprocess.parse_redraw:main"
ui2compose-build-dataset = "ui2compose.preprocess.build_dataset:main"
ui2compose-oversample = "ui2compose.preprocess.oversample_dataset:main"
ui2compose-app-split = "ui2compose.preprocess.app_split:main"
ui2compose-train = "ui2compose.train:main"
ui2compose-evaluate-detector = "ui2compose.evaluation.evaluate_detector:main"
ui2compose-benchmark = "ui2compose.evaluation.benchmark:main"
ui2compose-eval-layout = "ui2compose.evaluation.layout_eval:main"
ui2compose-evaluate = "ui2compose.evaluation.calculate_metrics:main"
ui2compose-visualize = "ui2compose.evaluation.visualize_successful_cases:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
