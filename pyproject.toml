[project]
name = "ui2compose"
version = "1.0.2"
description = "Automatic generation of Jetpack Compose UI code from Android screen designs using YOLO-based component detection"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Göktürk Bilgetürk", email = "gbilgeturk@yahoo.com" },
]
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.30.0",
]

[project.urls]
Repository = "https://github.com/gbilgeturk/ui2compose"
